<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>llm — trucs.ai</title>
  <meta name="description" content="Run an LLM in your browser via WebGPU. No server, no API key.">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    button {
      font-family: inherit;
      font-size: 1rem;
      padding: 0.5em 1.5em;
      border: 1px solid #111;
      background: #fff;
      color: #111;
      cursor: pointer;
      border-radius: 2px;
    }
    button:hover {
      background: #111;
      color: #fff;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    button:disabled:hover {
      background: #fff;
      color: #111;
    }
    #model-status {
      display: flex;
      align-items: center;
      gap: 0.75em;
    }
    #status-text {
      color: #555;
      font-size: 0.85rem;
    }
    textarea {
      font-family: inherit;
      font-size: 1rem;
      width: 100%;
      min-height: 4em;
      padding: 0.5em;
      border: 1px solid #ddd;
      background: #fff;
      color: #111;
      resize: vertical;
      line-height: 1.6;
      border-radius: 2px;
    }
    textarea:focus {
      outline: none;
      border-color: #111;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 1em;
      margin-top: 0.75em;
    }
    #output {
      margin-top: 1.5em;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 4em;
    }
    #stats {
      margin-top: 0.5em;
      color: #999;
      font-size: 0.8rem;
    }
    #voice-link {
      margin-top: 0.75em;
      font-size: 0.85rem;
    }
    #voice-link a {
      color: #111;
    }
    #voice-status {
      color: #555;
    }
  </style>
</head>
<body>
  <main>
    <h1>llm</h1>
    <p>
      A small language model running entirely in your browser via WebGPU.<br>
      No server, no API key. Your prompt never leaves your machine.<br>
      <span id="model-name">SmolLM2-1.7B</span>, single-turn chat.
    </p>

    <div id="model-status">
      <button id="load-btn">download</button>
      <span id="status-text"></span>
    </div>
    <div id="voice-link"><a href="#" id="voice-open">give a voice to your LLM</a> <span id="voice-status"></span><br><span id="voice-hint"></span></div>

    <hr>

    <textarea id="input" placeholder="Say something..." maxlength="2000"></textarea>
    <div class="controls">
      <button id="send-btn" disabled>send</button>
    </div>

    <div id="output"></div>
    <div id="stats"></div>

    <hr>

    <p><a href="https://huggingface.co/HuggingFaceTB/SmolLM2-1.7B-Instruct">SmolLM2-1.7B-Instruct</a>, single-turn chat via WebGPU with <a href="https://github.com/mlc-ai/web-llm">WebLLM</a>.</p>

    <hr>
    <p><a href="/">← trucs.ai</a></p>
  </main>

  <script type="module">
    import { CreateMLCEngine } from 'https://esm.run/@mlc-ai/web-llm';

    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const loadBtn = document.getElementById('load-btn');
    const statusText = document.getElementById('status-text');
    const output = document.getElementById('output');
    const stats = document.getElementById('stats');

    // Cross-tab voice link
    const channel = new BroadcastChannel('trucs-ai');
    const voiceOpen = document.getElementById('voice-open');
    const voiceStatus = document.getElementById('voice-status');
    const voiceHint = document.getElementById('voice-hint');
    let voiceConnected = false;
    let voiceTimeout = null;
    let openFallback = null;

    function disconnectVoice() {
      voiceConnected = false;
      voiceOpen.textContent = 'give a voice to your LLM';
      voiceStatus.textContent = '';
      voiceHint.textContent = '';
      if (voiceTimeout) { clearTimeout(voiceTimeout); voiceTimeout = null; }
    }

    function resetVoiceTimeout() {
      if (voiceTimeout) clearTimeout(voiceTimeout);
      voiceTimeout = setTimeout(disconnectVoice, 5000);
    }

    voiceOpen.addEventListener('click', (e) => {
      e.preventDefault();
      if (voiceConnected) {
        channel.postMessage({ from: 'llm', type: 'disconnect' });
        disconnectVoice();
      } else {
        channel.postMessage({ from: 'llm', type: 'enter_voice' });
        openFallback = setTimeout(() => {
          openFallback = null;
          window.open('/tts/?mode=voice', 'tts-voice');
        }, 300);
      }
    });

    channel.onmessage = (e) => {
      const msg = e.data;
      if (msg.from !== 'tts') return;

      if (openFallback) { clearTimeout(openFallback); openFallback = null; }

      if (msg.type === 'disconnect') {
        disconnectVoice();
        return;
      }

      if (!voiceConnected) {
        voiceConnected = true;
        voiceOpen.textContent = 'disconnect voice';
        voiceHint.textContent = 'go to the TTS tab to choose another voice';
      }

      if (msg.type === 'ready' || msg.type === 'voice') {
        voiceStatus.textContent = `voice: ${msg.voice}`;
      }

      resetVoiceTimeout();
    };

    let engine = null;
    let isCached = false;

    // Mobile: always 360M q4f32 (~290MB) — shader-f16 unreliable on Android
    // Desktop + shader-f16: 1.7B q4f16 (~1GB)
    // Desktop − shader-f16: 1.7B q4f32 (~2.7GB)
    const isMobile = navigator.userAgentData?.mobile
      ?? /Android|iPhone|iPod|webOS/i.test(navigator.userAgent);

    let selectedModel, modelSize, modelLabel;
    if (isMobile) {
      selectedModel = 'SmolLM2-360M-Instruct-q4f32_1-MLC';
      modelSize = '~290MB';
      modelLabel = 'SmolLM2-360M';
    } else if (navigator.gpu) {
      selectedModel = 'SmolLM2-1.7B-Instruct-q4f32_1-MLC';
      modelSize = '~2.7GB';
      modelLabel = 'SmolLM2-1.7B';
      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (adapter?.features.has('shader-f16')) {
          selectedModel = 'SmolLM2-1.7B-Instruct-q4f16_1-MLC';
          modelSize = '~1GB';
        }
      } catch (_) {}
    }
    if (modelLabel) document.getElementById('model-name').textContent = modelLabel;

    // Purge caches for wrong model variants, then check for valid cache
    try {
      const keys = await caches.keys();
      for (const key of keys) {
        const cache = await caches.open(key);
        const entries = await cache.keys();
        const hasSmolLM2 = entries.some(r => r.url.includes('SmolLM2'));
        if (!hasSmolLM2) continue;
        if (entries.some(r => r.url.includes(selectedModel))) {
          isCached = true;
          loadBtn.textContent = 'load';
        } else {
          await caches.delete(key);
        }
      }
    } catch (_) {}
    statusText.textContent = isCached
      ? `model cached locally: ${modelSize}`
      : `model download: ${modelSize}`;

    if (!navigator.gpu) {
      statusText.textContent = 'WebGPU is not supported in this browser.';
      loadBtn.disabled = true;
    }

    async function loadModel() {
      loadBtn.disabled = true;
      statusText.textContent = 'loading...';

      try {
        engine = await CreateMLCEngine(selectedModel, {
          initProgressCallback: (report) => {
            const pct = (report.progress * 100).toFixed(0);
            const mbMatch = report.text.match(/([\d.]+)\s*MB/);
            const mb = mbMatch ? `${Math.round(parseFloat(mbMatch[1]))}MB loaded, ` : '';
            const verb = isCached ? 'Loading' : 'Downloading';
            const phase = pct === '100' ? ' — testing WebGPU...' : '';
            statusText.textContent = `${verb}: ${mb}${pct}%${phase}`;
          },
        });

        statusText.textContent = 'ready';
        sendBtn.disabled = false;
      } catch (err) {
        const msg = err.message || String(err);
        if (/network|cache|fetch/i.test(msg)) {
          statusText.textContent = 'download failed — check your connection and try again';
          loadBtn.disabled = false;
        } else if (/VK_ERROR|pipeline/i.test(msg)) {
          statusText.textContent = 'WebGPU is not stable enough on this device yet.';
        } else {
          statusText.textContent = 'failed to load: ' + msg;
          loadBtn.disabled = false;
        }
        console.error(err);
      }
    }

    async function generate() {
      const text = input.value.trim().slice(0, 2000);
      if (!text || !engine) return;

      sendBtn.disabled = true;
      output.textContent = '';
      stats.textContent = '';
      if (voiceConnected) channel.postMessage({ from: 'llm', type: 'clear' });

      const start = performance.now();

      try {
        const chunks = await engine.chat.completions.create({
          messages: [{ role: 'user', content: text }],
          max_tokens: 512,
          stream: true,
        });

        let tokens = 0;
        let sentenceBuffer = '';
        for await (const chunk of chunks) {
          const delta = chunk.choices[0]?.delta?.content;
          if (delta) {
            output.textContent += delta;
            tokens++;
            sentenceBuffer += delta;
            let boundary;
            while ((boundary = sentenceBuffer.search(/[.!?]\s|\n/)) !== -1) {
              const ch = sentenceBuffer[boundary];
              const cutAt = ch === '\n' ? boundary : boundary + 1;
              const sentence = sentenceBuffer.slice(0, cutAt).trim();
              sentenceBuffer = sentenceBuffer.slice(cutAt).trimStart();
              if (sentence && voiceConnected) {
                channel.postMessage({ from: 'llm', type: 'chunk', text: sentence });
              }
            }
            if (sentenceBuffer.length > 200) {
              const spaceAt = sentenceBuffer.lastIndexOf(' ', 200);
              const cut = spaceAt > 0 ? spaceAt : 200;
              const fragment = sentenceBuffer.slice(0, cut).trim();
              sentenceBuffer = sentenceBuffer.slice(cut).trimStart();
              if (fragment && voiceConnected) {
                channel.postMessage({ from: 'llm', type: 'chunk', text: fragment });
              }
            }
          }
        }
        if (sentenceBuffer.trim() && voiceConnected) {
          channel.postMessage({ from: 'llm', type: 'chunk', text: sentenceBuffer.trim() });
        }
        if (voiceConnected) channel.postMessage({ from: 'llm', type: 'done' });

        const elapsed = (performance.now() - start) / 1000;
        const tokSec = (tokens / elapsed).toFixed(1);
        stats.textContent = `${tokens} tokens in ${elapsed.toFixed(1)}s (${tokSec} tok/s)`;
      } catch (err) {
        output.textContent = 'error: ' + err.message;
        console.error(err);
      }

      await engine.resetChat();
      sendBtn.disabled = false;
    }

    if (isCached) {
      loadModel();
    } else {
      loadBtn.addEventListener('click', loadModel);
    }
    sendBtn.addEventListener('click', generate);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !sendBtn.disabled) {
        e.preventDefault();
        generate();
      }
    });

  </script>
</body>
</html>
