<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sensors - trucs.ai</title>
  <meta name="description" content="Live readings of the motion, orientation, location, network and battery sensors of your device, read in your browser.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    button {
      font-family: inherit;
      font-size: 1rem;
      padding: 0.5em 1.5em;
      border: 1px solid #111;
      background: #fff;
      color: #111;
      cursor: pointer;
      border-radius: 2px;
    }
    button:hover {
      background: #111;
      color: #fff;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    button:disabled:hover {
      background: #fff;
      color: #111;
    }
    #model-status {
      display: flex;
      align-items: center;
      gap: 0.75em;
    }
    #status-text {
      color: #555;
      font-size: 0.85rem;
    }
    .row {
      display: flex;
      align-items: flex-start;
      gap: 0.75em;
      min-height: 1.7em;
      line-height: 1.4;
      padding: 0.15em 0;
      border-bottom: 1px dotted #ddd;
      font-size: 0.9rem;
    }
    .row .k {
      flex: 0 0 auto;
      color: #777;
      white-space: nowrap;
    }
    .row .k .u {
      display: block;
    }
    .row .v {
      flex: 1 1 60%;
      min-width: 0;
      text-align: right;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
      white-space: pre;
    }
    .row.note .v {
      white-space: normal;
    }
    .panel-desc {
      color: #999;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>sensors</h1>
    <p>
      Live readings of the motion, orientation, location, network and battery sensors of this device.<br>
      Motion and location start on a click.<br>
      No server: everything stays in your browser.
    </p>

    <div id="model-status">
      <button id="start">start</button>
      <span id="status-text"></span>
    </div>

    <hr>

    <div id="motion"></div>
    <div id="location"></div>
    <div id="network"></div>
    <div id="battery"></div>

    <hr>

    <p class="panel-desc">Source: sensors-web.</p>

    <hr>
    <p><a href="/sensors/plots/">live plots</a></p>
    <p><a href="/">← trucs.ai</a></p>
  </main>

  <script>
  (function () {
    'use strict';

    var stateEl = document.getElementById('status-text');
    var motionEl = document.getElementById('motion');
    var locationEl = document.getElementById('location');
    var networkEl = document.getElementById('network');
    var batteryEl = document.getElementById('battery');

    function n(x, d) { return (x === null || x === undefined || typeof x !== 'number' || !isFinite(x)) ? String(x) : x.toFixed(d === undefined ? 2 : d); }
    function num(x) { return typeof x === 'number' && isFinite(x); }

    // ---------- row registry: rows are created once, values only ever update in place ----------
    var cells = {};      // id -> value <div>
    var pending = {};    // id -> latest text, flushed on a timer (never on every event)

    function addRow(container, id, label, initial) {
      var row = document.createElement('div');
      row.className = 'row';
      var k = document.createElement('div');
      k.className = 'k';
      var m = /^(.*) \((.*)\)$/.exec(label);
      k.textContent = m ? m[1] : label;
      if (m) {
        var u = document.createElement('span');
        u.className = 'u';
        u.textContent = m[2];
        k.appendChild(u);
      }
      var v = document.createElement('div');
      v.className = 'v';
      v.textContent = initial || '';
      row.appendChild(k);
      row.appendChild(v);
      container.appendChild(row);
      cells[id] = v;
    }
    function addNet(id, label, initial) { addRow(networkEl, id, label, initial); }
    function addBattery(id, label, initial) { addRow(batteryEl, id, label, initial); }

    // A row for a value that only exists once it is first read.
    function ensureRow(container, id, label) {
      if (!cells[id]) addRow(container, id, label);
    }

    // A plain sentence in place of a reading, for a sensor that is allowed but gives nothing.
    function setNote(container, id, label, text) {
      if (!cells[id]) {
        addRow(container, id, label);
        cells[id].parentElement.className = 'row note';
      }
      cells[id].textContent = text;
    }

    // Rows for things the device does not report are removed, never listed.
    function removeRow(id) {
      var cell = cells[id];
      var row = cell ? cell.parentElement : null;
      if (row && row.parentElement) row.parentElement.removeChild(row);
      delete cells[id];
      delete pending[id];
    }

    // One component per line, labels and numbers padded so the columns stay put as values change.
    function lines(pairs, d, width) {
      var lw = Math.max.apply(null, pairs.map(function (p) { return p[0].length; }));
      return pairs.map(function (p) {
        return p[0] + new Array(lw - p[0].length + 2).join(' ') + n(p[1], d).padStart(width || 8);
      }).join('\n');
    }

    function setVal(id, text) { pending[id] = String(text); }

    // Flush cached values to the DOM at a fixed cadence, decoupled from event rate,
    // so a sensor firing at 60Hz never touches layout more than 4 times a second.
    setInterval(function () {
      Object.keys(pending).forEach(function (id) {
        var el = cells[id];
        if (!el) return;
        var text = pending[id];
        if (el.textContent !== text) el.textContent = text;
      });
      pending = {};
      updateStatus();
    }, 250);

    // ---------- status: one sentence, replaced in place ----------
    var started = false, waitOver = false;
    function updateStatus() {
      var count = document.querySelectorAll('#motion .row:not(.note), #location .row:not(.note)').length;
      var text;
      if (!started) text = 'tap start to read motion and location';
      else if (count) text = 'reading ' + count + (count === 1 ? ' value' : ' values') + ' from motion and location';
      else if (waitOver) text = 'no motion or location readings on this device';
      else text = 'waiting for sensor data';
      if (stateEl.textContent !== text) stateEl.textContent = text;
    }

    // ---------- network and battery: readable without a click ----------

    function buildNetwork() {
      addNet('online', 'online', navigator.onLine ? 'yes' : 'no');
      window.addEventListener('online', function () { setVal('online', 'yes'); });
      window.addEventListener('offline', function () { setVal('online', 'no'); });
      var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      var fields = [
        ['netType', 'connection type', 'type', function (v) { return v; }],
        ['netEffective', 'effective type', 'effectiveType', function (v) { return v; }],
        ['netDownlink', 'downlink', 'downlink', function (v) { return n(v, 2) + ' Mb/s'; }],
        ['netDownlinkMax', 'max downlink', 'downlinkMax', function (v) { return v === Infinity ? 'unknown' : n(v, 0) + ' Mb/s'; }],
        ['netRtt', 'round trip time', 'rtt', function (v) { return v + ' ms'; }],
        ['netSaveData', 'data saver', 'saveData', function (v) { return v ? 'on' : 'off'; }]
      ];
      fields.forEach(function (f) {
        if (conn && f[2] in conn) {
          addNet(f[0], f[1], f[3](conn[f[2]]));
        }
      });
      if (conn && conn.addEventListener) {
        conn.addEventListener('change', function () {
          fields.forEach(function (f) { if (f[2] in conn) setVal(f[0], f[3](conn[f[2]])); });
        });
      }
    }

    function buildPower() {
      if (navigator.getBattery) {
        addBattery('battery', 'battery', 'checking…');
        navigator.getBattery().then(function (b) {
          function mins(sec) { return sec >= 3600 ? n(sec / 3600, 1) + ' h' : Math.round(sec / 60) + ' min'; }
          function upd() {
            var t = '';
            if (b.charging && isFinite(b.chargingTime) && b.level < 1) t = ', full in ' + mins(b.chargingTime);
            else if (!b.charging && isFinite(b.dischargingTime)) t = ', ' + mins(b.dischargingTime) + ' left';
            setVal('battery', Math.round(b.level * 100) + '% ' + (b.charging ? 'charging' : 'on battery') + t);
          }
          upd();
          ['levelchange', 'chargingchange', 'chargingtimechange', 'dischargingtimechange'].forEach(function (ev) { b.addEventListener(ev, upd); });
        }, function () { removeRow('battery'); });
      }
    }

    // ---------- motion and orientation: a row appears with its first reading ----------

    function rad2deg(x) { return x * 180 / Math.PI; }
    function xyz(scale) {
      return function (s) { var k = scale || 1; return lines([['x', s.x * k], ['y', s.y * k], ['z', s.z * k]], 2); };
    }
    function quatText(s) {
      var q = s.quaternion, x = q[0], y = q[1], z = q[2], w = q[3];
      var yaw = Math.atan2(2 * (w * z + x * y), 1 - 2 * (y * y + z * z));
      var pitch = Math.asin(Math.max(-1, Math.min(1, 2 * (w * y - z * x))));
      var roll = Math.atan2(2 * (w * x + y * z), 1 - 2 * (x * x + y * y));
      return lines([['yaw', rad2deg(yaw)], ['pitch', rad2deg(pitch)], ['roll', rad2deg(roll)]], 0);
    }
    var fromSensorApi = {};   // ids already fed by the Generic Sensor API; the legacy events fill the rest
    function motionValue(id, label, text, viaApi) {
      if (viaApi) fromSensorApi[id] = true; else if (fromSensorApi[id]) return;
      ensureRow(motionEl, id, label);
      setVal(id, text);
    }

    var L_ACCEL = 'accelerometer (m/s²)', L_LINEAR = 'linear acceleration (m/s²)', L_GYRO = 'gyroscope (°/s)', L_ORIENT = 'orientation (°)';
    var motionListening = false, sensorBlocked = false, motionDenied = false;
    function startGenericSensor(id, label, ctor, opts, fmt) {
      if (!(ctor in window)) return false;
      try {
        var s = new window[ctor](opts);
        s.addEventListener('reading', function () {
          if (s.x === null || s.illuminance === null) return;
          motionValue(id, label, fmt(s), true);
        });
        s.addEventListener('error', function (e) {
          if (e.error && e.error.name === 'NotAllowedError') sensorBlocked = true;
        });
        s.start();
        return true;
      } catch (e) { return false; }
    }

    function startMotion() {
      var f = { frequency: 10 };
      startGenericSensor('accelerometer', L_ACCEL, 'Accelerometer', f, xyz());
      startGenericSensor('linearAccel', L_LINEAR, 'LinearAccelerationSensor', f, xyz());
      startGenericSensor('gravity', 'gravity (m/s²)', 'GravitySensor', f, xyz());
      startGenericSensor('gyroscope', L_GYRO, 'Gyroscope', f, xyz(180 / Math.PI));
      startGenericSensor('magnetometer', 'magnetometer (µT)', 'Magnetometer', f, xyz());
      startGenericSensor('orientation', L_ORIENT, 'AbsoluteOrientationSensor', f, quatText);
      startGenericSensor('ambientLight', 'ambient light', 'AmbientLightSensor', { frequency: 2 }, function (s) { return n(s.illuminance, 0) + ' lux'; });

      if (motionListening) return;
      motionListening = true;
      window.addEventListener('devicemotion', function (e) {
        var a = e.accelerationIncludingGravity;
        if (a && num(a.x)) motionValue('accelerometer', L_ACCEL, lines([['x', a.x], ['y', a.y], ['z', a.z]], 2));
        var l = e.acceleration;
        if (l && num(l.x)) motionValue('linearAccel', L_LINEAR, lines([['x', l.x], ['y', l.y], ['z', l.z]], 2));
        var r = e.rotationRate;
        if (r && num(r.alpha)) motionValue('gyroscope', L_GYRO, lines([['alpha', r.alpha], ['beta', r.beta], ['gamma', r.gamma]], 1));
      });
      window.addEventListener('deviceorientation', function (e) {
        if (num(e.alpha) && num(e.beta) && num(e.gamma)) motionValue('orientation', L_ORIENT, lines([['alpha', e.alpha], ['beta', e.beta], ['gamma', e.gamma]], 0));
      });
    }

    // ---------- location: one watch, each field shown once it has a value ----------

    var geoWatchId = null, geoFixes = [], geoLast = 0, geoPromoted = false;
    function startLocation() {
      if (!navigator.geolocation) return;
      if (geoWatchId !== null) navigator.geolocation.clearWatch(geoWatchId);
      geoWatchId = navigator.geolocation.watchPosition(updateGeolocation, geoError, { enableHighAccuracy: true, maximumAge: 0 });
    }
    function geoError(err) {
      if (geoPromoted) return;
      setNote(locationEl, 'geoNote', 'location', err && err.code === 1 ? 'permission denied' : 'permission given, location is off on this device');
    }
    function geoField(id, label, value, text) {
      if (num(value)) { ensureRow(locationEl, id, label); setVal(id, text); }
      else if (cells[id]) setVal(id, 'unavailable');
    }
    function updateGeolocation(pos) {
      var c = pos.coords;
      if (!geoPromoted) promoteGeolocation();
      removeRow('geoNote');
      geoLast = pos.timestamp;
      geoFixes.push(performance.now());
      if (geoFixes.length > 8) geoFixes.shift();
      setVal('geoPosition', lines([['lat', c.latitude], ['lon', c.longitude]], 5, 10));
      setVal('geoAccuracy', '±' + n(c.accuracy, 0) + ' m');
      geoField('geoAltitude', 'altitude', c.altitude, n(c.altitude, 1) + ' m' + (num(c.altitudeAccuracy) ? ' (±' + n(c.altitudeAccuracy, 0) + ' m)' : ''));
      geoField('geoHeading', 'heading', c.heading, n(c.heading, 0) + '°');
      geoField('geoSpeed', 'speed', c.speed, n(c.speed, 2) + ' m/s (' + n(c.speed * 3.6, 1) + ' km/h)');
      if (geoFixes.length > 1) {
        var span = (geoFixes[geoFixes.length - 1] - geoFixes[0]) / 1000;
        ensureRow(locationEl, 'geoRate', 'location updates');
        setVal('geoRate', n((geoFixes.length - 1) / span, 2) + ' per second');
      }
    }
    setInterval(function () {
      if (geoLast && cells.geoAge) setVal('geoAge', n(Math.max(0, (Date.now() - geoLast) / 1000), 0) + ' s ago');
    }, 1000);
    function promoteGeolocation() {
      geoPromoted = true;
      ensureRow(locationEl, 'geoPosition', 'location (°)');
      ensureRow(locationEl, 'geoAccuracy', 'location accuracy');
      ensureRow(locationEl, 'geoAge', 'last fix');
    }

    // ---------- boot ----------

    buildNetwork();
    buildPower();

    document.getElementById('start').onclick = function () {
      this.textContent = 'restart';
      started = true;
      var go = function () {
        startMotion();
        startLocation();
        setTimeout(function () {
          waitOver = true;
          if (!motionEl.children.length && (sensorBlocked || motionDenied)) setNote(motionEl, 'motionNote', 'motion', 'permission denied');
        }, 5000);
      };
      if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission().then(function (r) { if (r === 'denied') motionDenied = true; go(); }, go);
      } else {
        go();
      }
    };

    updateStatus();
  })();
  </script>
</body>
</html>
